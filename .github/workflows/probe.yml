name: probe

# 指標が抽出できなかった会社で、XBRLの実際の要素名を調べる。
# 科目名は業種ごとに違い（完成工事高・営業収益・売上収益など）、推測で
# パターンを足すと外すため、必ずこれで実物を見てから直す。
on:
  workflow_dispatch:
    inputs:
      sec_codes:
        description: "証券コード（カンマ区切り）"
        default: "1332"
      keywords:
        description: "要素IDにかける正規表現"
        default: "Shareholder|Owner|Director|Officer|CorporateAuditor"
      raw:
        description: "1ならコンテキストで絞らずそのまま出す"
        default: "0"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python probe.py
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          SEC_CODES: ${{ inputs.sec_codes }}
          KEYWORDS: ${{ inputs.keywords }}
          RAW: ${{ inputs.raw }}
