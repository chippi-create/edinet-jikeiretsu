name: edinet-fetch

on:
  workflow_dispatch:
    inputs:
      sec_codes:
        description: "証券コード（カンマ区切り／空なら訂正のある会社を自動選択）"
        default: ""
      auto_pick:
        description: "試し取りする社数（0＝索引にある全社を順に処理）"
        default: "0"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: fetch
        run: python fetch2.py
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          SEC_CODES: ${{ inputs.sec_codes }}
          AUTO_PICK: ${{ inputs.auto_pick }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edinet-fetch
          path: out/
          if-no-files-found: ignore
